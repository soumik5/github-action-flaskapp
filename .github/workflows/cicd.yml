name: my weather flask app ci/cd

on: 
  push:

jobs:
  testjob:
    runs-on: ubuntu-latest
    steps:
      - name: checkout my code reportory
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: install dependencies
        run : |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: run tests
        run: |
          pytest
  
  buildjob:
    runs-on: ubuntu-latest
    needs: testjob
    steps: 
      - name: checkout my code repository
        uses: actions/checkout@v2

      - name: setup docker
        uses: docker/setup-buildx-action@v1
        with:
          driver: docker

      - name: login to docker hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push docker image
        run: |
          docker build -t weather-flask-app:version1 .
          docker tag weather-flask-app:version1 ${{ secrets.DOCKER_USERNAME }}/weather-flask-app:version1
          docker push ${{ secrets.DOCKER_USERNAME }}/weather-flask-app:version1
