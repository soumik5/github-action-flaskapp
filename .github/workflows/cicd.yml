name: my weather flask app ci/cd

on: 
  push:

jobs:
  testjob:
    runs-on: ubuntu-latest
    steps:
      - name: checkout my code reportory
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: install dependencies
        run : |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: show files in my repository
        run: |
          pwd
          ls -R
      
      - name: run tests
        run: pytest -v --collect-only
  
  buildjob:
    runs-on: ubuntu-latest
    needs: testjob
    steps: 
      - name: checkout my code repository
        uses: actions/checkout@v4

      - name: setup docker
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: build and push docker image
        run: |
          docker build -t weather-flask-app:version1 .
          docker tag weather-flask-app:version1 ${{ secrets.DOCKER_USERNAME }}/weather-flask-app:version1
          docker push ${{ secrets.DOCKER_USERNAME }}/weather-flask-app:version1

  deployjob:
    runs-on: ubuntu-latest
    needs: buildjob
    steps:
      - name: setup ssh agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
      
      - name: deploy the docker image to my ec2 and run the container
        run: |
          ssh -o "strictHostKeyChecking=no" ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/weather-flask-app:version1
          sudo docker stop mycontainer
          sudo docker rm mycontainer
          sudo docker run -d --name mycontainer -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/weather-flask-app:version1
          "